name: Feature request
description: Suggest a capability for the preview.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do that the package makes hard today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like it to do
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      description: >
        MarkdownGlance renders with the Sublime API alone — no browser, no
        WebView, no runtime dependency outside the standard library and its two
        Package Control libraries. It starts a process in two narrow places:
        Open in Browser, and the local SVG renderer
        ([ADR 0019](https://github.com/feibuilds/MarkdownGlance/blob/main/docs/adr/0019-svg-is-drawn-by-a-local-renderer.md)).
        See [Scope](https://github.com/feibuilds/MarkdownGlance/blob/main/CONTRIBUTING.md#scope)
        in CONTRIBUTING.md.
      options:
        - label: This can be built within that constraint, as far as I can tell.
