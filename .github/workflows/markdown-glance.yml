name: MarkdownGlance

on: [push, pull_request]

jobs:
  pure-python:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Keep one command spelling for every host; Windows runners have bash.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.8", "3.14"]
        # The parser is a Package Control library, and the channel serves a
        # different release to each plugin host: this pins what each host gets.
        include:
          - python-version: "3.8"
            libraries: "Markdown==3.2.2 pymdown-extensions==8.1.1"
          - python-version: "3.14"
            libraries: "Markdown==3.10.3 pymdown-extensions==11.0.2"
        exclude:
          # macOS runners are arm64 and setup-python publishes no 3.8 build for
          # them, so macOS covers 3.14 only. Linux and Windows cover 3.8.
          - os: macos-latest
            python-version: "3.8"
    steps:
      # The package imports itself as `MarkdownGlance.preview`, so the checkout
      # directory must carry the package name and tests run from its parent.
      - uses: actions/checkout@v7
        with:
          path: MarkdownGlance
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --disable-pip-version-check ${{ matrix.libraries }}
      - run: python -m unittest discover -s MarkdownGlance/tests -t . -p 'test_*.py'
      - run: python -m compileall -q MarkdownGlance/preview MarkdownGlance/plugin.py MarkdownGlance/tests
